# Who Knew Whom (Nat Goodden) - Jekyll site for GitHub Pages
#
# Rebuilt from the WordPress site at culturalcartography.net, with its pages, URLs and design
# (the GeneratePress theme and the WKW child theme), plus the field (graphs of the network) and SPARQL
# query page that run in the browser.
#
# Every page is a file in pages/, and its permalink gives its URL: pages/what.html is /what/,
# pages/names/charles-babbage.html is /names/charles-babbage/.
#
# Generated by tools/build_site.py from data/wkw.json (don't edit these by hand):
#   _data/people.json, _data/names.json, _data/latest.json
#   pages/names.html       the list of names
#   pages/names/           a page for each person with a bio
#   pages/types/           each profession's people, ten to a page (mathematician.html is
#                          /types/mathematician/, mathematician-2.html /types/mathematician/page/2/)
#   assets/data/           graph.json, search.json and the RDF (*.ttl)
#
# Copied from WordPress once by tools/import_pages.py, and edited here from now on, in pages/:
#   what, questions, contact, contact-2, blog, 64 (the blog post), author-nat,
#   category-uncategorized, 404
#
# Written for this site, in pages/:
#   index.html             home page (latest additions)
#   search.html            searches names and bios in the browser (assets/js/search.js)
#   field.html             force-directed graph around a person (assets/js/field.js, d3)
#   network.html           everyone at once, in WebGL (assets/js/network.js, sigma.js:
#                          assets/js/vendor/sigma-bundle.min.js, built by tools/field-bundle)
#   query.html             SPARQL queries over the RDF (assets/js/query*.js, Oxigraph)
#
# The design: assets/css/ holds GeneratePress's and GP Premium's stylesheets, the WKW theme's
# (wkw.css) and the CSS WordPress put inline: wp-inline.css (Customizer colours and the like),
# menu-logo-inline.css and custom.css (Additional CSS), loaded in the order WordPress used.

title: Who Knew Whom
description: >-
  Who knew whom among more than 3,000 figures in the arts and sciences: research by Nat Goodden.
url: https://e-2-org.github.io
baseurl: "/wkw"

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor

defaults:
  - scope:
      path: ""
    values:
      layout: default
