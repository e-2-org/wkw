# Who Knew Whom (Nat Goodden) - Jekyll site for GitHub Pages
#
# Rebuilt from the WordPress site at culturalcartography.net, with its pages, URLs and design
# (the GeneratePress theme and the WKW child theme), plus a graph of the network and a SPARQL
# query page that run in the browser.
#
# Generated by tools/build_site.py from data/wkw.json (don't edit these by hand):
#   _data/people.json, _data/names.json, _data/latest.json
#   names/                 the list of names, and a page for each person with a bio
#   types/                 each profession's people, ten to a page
#   assets/data/           graph.json, search.json and the RDF (*.ttl)
#
# Copied from WordPress once by tools/import_pages.py, and edited here from now on:
#   what/, questions/, contact/, contact-2/, blog/, 64/ (the blog post), author/, category/, 404.html
#
# Written for this site:
#   index.html             home page (latest additions)
#   search/                searches names and bios in the browser (assets/js/search.js)
#   graph/                 force-directed graph around a person (assets/js/graph.js, d3)
#   sparql/                SPARQL queries over the RDF (assets/js/sparql*.js, Oxigraph)
#
# The design: assets/css/ holds GeneratePress's and GP Premium's stylesheets, the WKW theme's
# (wkw.css) and the CSS WordPress put inline: wp-inline.css (Customizer colours and the like),
# menu-logo-inline.css and custom.css (Additional CSS), loaded in the order WordPress used.

title: Who Knew Whom
description: >-
  Who knew whom among more than 3,000 figures in the arts and sciences: research by Nat Goodden.
url: https://e-2-org.github.io
baseurl: "/wkw"

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor

defaults:
  - scope:
      path: ""
    values:
      layout: default
